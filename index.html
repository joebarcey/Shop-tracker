<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="application-name" content="Shop Tracker">
<title>Shop Tracker</title>
<meta name="description" content="Projects, steps, materials and tasks, sized for Meta Ray-Ban Display glasses">
<meta name="mrbd-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one 600x600-friendly column; black = see-through on the glasses, so the page is dark by design */
:root{
  --bg:#000000; --panel:#16140f; --line:#332e24;
  --fg:#F4EFE4; --muted:#A39A88; --accent:#FFB547; --ok:#86D9A6;
  --display:'Saira Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:22px;line-height:1.3;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:12px;min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1.05;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.eyebrow{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,input{font:inherit;color:inherit}
button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left}
button:focus,input:focus{outline:3px solid var(--accent);outline-offset:2px}
.back{flex:none;min-width:56px;justify-content:center;font-size:26px;color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list button{width:100%}
.proj{flex-direction:column;align-items:stretch;gap:8px}
.proj .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.proj .name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:18px;flex:none}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tag{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:middle}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tabs button{justify-content:center;font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.06em;text-transform:uppercase;padding:8px 4px;flex-direction:column;gap:0}
.tabs button small{font-family:var(--body);font-size:15px;color:var(--muted);letter-spacing:0;font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
.item .box{flex:none;width:28px;height:28px;border:3px solid var(--muted);border-radius:7px;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--bg)}
.item[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok)}
.item[aria-checked="true"] .txt{color:var(--muted);text-decoration:line-through}
.item .num{flex:none;font-family:var(--display);font-weight:700;color:var(--accent);min-width:1.4em;font-variant-numeric:tabular-nums}
.txt{min-width:0;overflow-wrap:anywhere}
.next{border-color:var(--accent)}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:56px}
.add input::placeholder{color:var(--muted)}
.add button{flex:none;color:var(--accent);font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{font-size:18px;min-height:48px;color:var(--muted)}
.tools button.warn{color:var(--accent);border-color:var(--accent)}
.empty{color:var(--muted);font-size:19px;padding:6px 2px}
.hint{color:var(--muted);font-size:15px}
.sync{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:auto;flex:none;display:flex;align-items:center;gap:6px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--ok)}
.sync.warn{color:var(--accent)}
.sync.warn i{background:var(--accent)}
.err{color:var(--accent);font-size:17px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
</style>

</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  const KEY = 'shop-tracker-v1';
  const TABS = [['steps','Steps'],['materials','Materials'],['tasks','Tasks']];
  const uid = () => Math.random().toString(36).slice(2,10);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tally = p => { let d=0,n=0; TABS.forEach(([k])=>(p[k]||[]).forEach(i=>{n++; if(i.d)d++;})); return [d,n]; };
  const app = document.getElementById('app');

  // mode: 'loading' -> 'synced' (shared store) or 'local' (this device only)
  let mode = 'loading', stale = false, readOnly = false, errMsg = '';
  let db = null, state = {projects:[]}, armed = null;
  const chains = {};

  function loadLocal(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.projects)) return s; } catch(e){} return {projects:[]}; }
  function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

  function fail(e){
    const c = e && e.code;
    if (c==='invalid_argument' || c==='not_granted') { readOnly = true; errMsg = 'This view can look but not change. Sign in as the owner to edit.'; }
    else if (c==='quota_exceeded') errMsg = 'Storage is full. Delete an old project to make room.';
    else errMsg = 'Couldn’t save that change. Check your connection and try again.';
    render();
  }
  function bodyOf(p){ const b={name:p.name,created:p.created||Date.now(),steps:p.steps,materials:p.materials,tasks:p.tasks}; if(p.example) b.example=true; return b; }
  function saveProject(p){
    if (mode!=='synced'){ saveLocal(); return; }
    const ref = db.doc('projects/'+p.id), body = bodyOf(p);
    chains[p.id] = (chains[p.id]||Promise.resolve()).then(()=>ref.set(body)).catch(fail);
  }
  function removeProject(p){
    state.projects = state.projects.filter(x=>x!==p);
    if (mode!=='synced'){ saveLocal(); return; }
    const ref = db.doc('projects/'+p.id);
    chains[p.id] = (chains[p.id]||Promise.resolve()).then(()=>ref.delete()).catch(fail);
  }

  function route(){
    const m = location.hash.match(/^#p-([a-z0-9]+)-(steps|materials|tasks)$/);
    const p = m && state.projects.find(x=>x.id===m[1]);
    return p ? {p, tab:m[2]} : null;
  }

  function syncBadge(){
    if (mode==='loading') return `<span class="sync"><i></i>Connecting</span>`;
    if (mode==='local') return `<span class="sync warn"><i></i>Saved on glasses</span>`;
    if (stale) return `<span class="sync warn"><i></i>Reconnecting</span>`;
    return `<span class="sync on"><i></i>Synced</span>`;
  }

  function render(){
    const a = document.activeElement;
    const keep = a && a.dataset && a.dataset.key;
    const draft = a && a.tagName==='INPUT' ? a.value : null;
    const r = route();
    armed = armed && r && armed.startsWith(r.p.id) ? armed : null;
    app.innerHTML = r ? project(r.p, r.tab) : home();
    const el = (keep && app.querySelector(`[data-key="${keep}"]`)) || app.querySelector('button[data-key]');
    if (el){ if (el.tagName==='INPUT' && draft!==null) el.value = draft; el.focus(); }
  }

  function home(){
    const items = state.projects.map(p=>{
      const [d,n]=tally(p), pct=n?Math.round(d/n*100):0;
      return `<li><button class="proj" data-key="open-${p.id}" data-go="${p.id}">
        <span class="row"><span class="name">${esc(p.name)}${p.example?'<span class="tag">Example</span>':''}</span><span class="count">${d}/${n}</span></span>
        <span class="bar"><i style="width:${pct}%"></i></span></button></li>`;
    }).join('');
    const empty = mode==='loading' ? 'Loading your projects…' : 'No projects yet. Add one below. The garage is suspiciously clean.';
    return `<div class="top"><div><div class="eyebrow">Shop Tracker</div><h1>Projects</h1></div>${syncBadge()}</div>
      ${errMsg?`<p class="err">${esc(errMsg)}</p>`:''}
      <ul class="list">${items || `<li class="empty">${empty}</li>`}</ul>
      ${readOnly||mode==='loading'?'':`<form class="add" data-add="project"><input id="new-project" data-key="in-project" placeholder="New project name" autocomplete="off" aria-label="New project name"><button data-key="add-project">Add</button></form>
      <p class="hint">Pinch a text box on the glasses to write or dictate.</p>`}`;
  }

  function project(p, tab){
    const list = p[tab]||[];
    const firstOpen = tab==='steps' ? list.findIndex(i=>!i.d) : -1;
    const tabs = TABS.map(([k,l])=>{
      const arr=p[k]||[], d=arr.filter(i=>i.d).length;
      return `<button role="tab" data-key="tab-${k}" data-tab="${k}" aria-selected="${k===tab}">${l}<small>${d}/${arr.length}</small></button>`;
    }).join('');
    const rows = list.map((i,ix)=>`<li><button class="item${ix===firstOpen?' next':''}" role="checkbox" aria-checked="${!!i.d}" data-key="i-${i.id}" data-toggle="${i.id}"${readOnly?' disabled':''}>
        <span class="box" aria-hidden="true">${i.d?'✓':''}</span>${tab==='steps'?`<span class="num">${ix+1}</span>`:''}<span class="txt">${esc(i.t)}</span></button></li>`).join('');
    const label = {steps:'step',materials:'material',tasks:'task'}[tab];
    const del = armed===p.id+'-del';
    return `<div class="top"><button class="back" data-key="back" data-back aria-label="Back to projects">‹</button>
        <div style="min-width:0"><div class="eyebrow">Project${p.example?' · Example':''}</div><h1>${esc(p.name)}</h1></div>${syncBadge()}</div>
      ${errMsg?`<p class="err">${esc(errMsg)}</p>`:''}
      <div class="tabs" role="tablist">${tabs}</div>
      <ul class="list">${rows || `<li class="empty">No ${label}s yet. Add one below.</li>`}</ul>
      ${readOnly?'':`<form class="add" data-add="${tab}"><input id="new-${tab}" data-key="in-${tab}" placeholder="Add a ${label}" autocomplete="off" aria-label="Add a ${label}"><button data-key="add-${tab}">Add</button></form>
      <div class="tools">
        <button data-key="clear" data-clear>Remove checked ${label}s</button>
        <button data-key="delp" data-delp class="${del?'warn':''}">${del?'Press again to delete project':'Delete project'}</button>
      </div>`}`;
  }

  app.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    const r = route();
    if (b.dataset.go){ location.hash = `p-${b.dataset.go}-steps`; return; }
    if (b.hasAttribute('data-back')){ location.hash='home'; return; }
    if (!r) return;
    if (b.dataset.tab){ location.replace(`#p-${r.p.id}-${b.dataset.tab}`); return; }
    if (readOnly) return;
    errMsg='';
    if (b.dataset.toggle){ const it=(r.p[r.tab]||[]).find(i=>i.id===b.dataset.toggle); if(it){it.d=!it.d; saveProject(r.p); render();} return; }
    if (b.hasAttribute('data-clear')){ r.p[r.tab]=(r.p[r.tab]||[]).filter(i=>!i.d); saveProject(r.p); render(); return; }
    if (b.hasAttribute('data-delp')){
      if (armed===r.p.id+'-del'){ removeProject(r.p); armed=null; location.hash='home'; render(); }
      else { armed=r.p.id+'-del'; render(); }
    }
  });

  app.addEventListener('submit', e=>{
    e.preventDefault();
    if (readOnly) return;
    const f=e.target, input=f.querySelector('input'), t=input.value.trim();
    if(!t){ input.focus(); return; }
    errMsg=''; input.value='';
    if (f.dataset.add==='project'){
      const p={id:uid(),name:t,created:Date.now(),steps:[],materials:[],tasks:[]};
      state.projects.push(p); saveProject(p); location.hash=`p-${p.id}-steps`; return;
    }
    const r=route(); if(!r) return;
    (r.p[r.tab]=r.p[r.tab]||[]).push({id:uid(),t,d:false}); saveProject(r.p); render();
    const again=app.querySelector('form.add input'); if(again) again.focus();
  });

  window.addEventListener('hashchange', render);
  render();

  function goLocal(){ mode='local'; state=loadLocal();
    if(!state.projects.length){ state={projects:[{id:'ambulance',name:'Ambulance propane setup',example:true,created:1,
      steps:[{id:'s1',t:'Mount the 100 lb tank bracket',d:true},{id:'s2',t:'Install two-stage regulator',d:true},{id:'s3',t:'Run line to heater, stove and fridge',d:false},{id:'s4',t:'Leak-test every fitting with soapy water',d:false},{id:'s5',t:'Install propane / CO detector',d:false}],
      materials:[{id:'m1',t:'100 lb propane tank',d:true},{id:'m2',t:'Two-stage regulator',d:true},{id:'m3',t:'Rated gas line + flare fittings',d:false},{id:'m4',t:'Yellow gas-rated thread sealant',d:false},{id:'m5',t:'Propane / CO detector',d:false}],
      tasks:[{id:'t1',t:'Call supplier about first fill',d:false},{id:'t2',t:'Check vehicle tank rules',d:false}]}]}; saveLocal(); }
    render(); }

  const use = window.claude && window.claude.use;
  if (!use){ goLocal(); return; }
  Promise.resolve(use.call(window.claude,'db')).then(d=>{
    if (!d){ goLocal(); return; }
    db = d;
    let timer = setTimeout(()=>{ stale=true; if(mode==='loading') mode='synced'; render(); }, 10000);
    db.collection('projects').onSnapshot(snap=>{
      state.projects = snap.docs.map(s=>{ const b=JSON.parse(JSON.stringify(s.data()||{})); return {id:s.id,...b}; })
        .sort((a,b)=>(a.created||0)-(b.created||0));
      mode='synced';
      if (!snap.metadata.fromCache){ stale=false; clearTimeout(timer); }
      render();
    }, err=>{
      clearTimeout(timer);
      stale=true; errMsg = err.code==='revoked' ? 'Sync is off for this view.' : 'Lost the connection to your projects. Reopen the page to reconnect.';
      render();
    });
  }).catch(goLocal);
})();
</script>
</body>
</html>
